<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#04070d" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SUNDAY" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/pwa-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; connect-src 'self' http://127.0.0.1:8765 http://localhost:8765 https: ws: wss:; font-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'"
    />
    <title>SUNDAY Animation Studio</title>
    <script>
      // Adaptive base resolution: anchors to / on Web/PWA, retains relative for Electron file://
      if (typeof window !== "undefined" && !window.location.protocol.startsWith("file")) {
        const b = document.createElement("base");
        b.href = "/";
        document.head.prepend(b);
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
